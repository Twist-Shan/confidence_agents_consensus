[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-agents"
version = "0.1.0"
description = "Controlled confidence-allocation experiments and evidence-visibility pilots"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
reports = ["reportlab>=4", "pypdf>=5"]

[tool.setuptools.packages.find]
include = ["confidence_agents*"]
